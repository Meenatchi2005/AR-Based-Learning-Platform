{% extends 'mainapp/base.html' %}
{% load static %}

{% block title %}TeachAR{% endblock title %}

{% block content %}

<div class="container mt-4">

    <!-- Back Button -->
    <h5 class="mb-4">
        <a style="text-decoration:none; color:black" href="{% url 'home' %}">
            ← Subjects
        </a>
    </h5>

    <!-- Subject Name -->
    <h2>{{ subject.name }}</h2>

    <!-- Topics Title -->
    <h3 class="mt-5 mb-4">Topics</h3>

    <!-- Topics Grid -->
    <div class="row">

        {% for topic in topics %}
        <div class="col-lg-4 col-md-6 col-sm-12 mb-4">

            <div class="card h-100 shadow-sm">

                <!-- Topic Image -->
                <img class="card-img-top" src="{{ topic.image.url }}" alt="{{ topic.name }}"
                    style="height: 320px; object-fit: cover;">

                <!-- Card Body -->
                <div class="card-body d-flex flex-column">

                    <!-- Topic Title -->
                    <h5 class="card-title text-center">
                        {{ topic.name }}
                    </h5>

                    <!-- Button at Bottom -->
                    <div class="mt-auto text-center">
                        <a href="{% url 'view_3d' topic.id %}" target="_blank" class="btn btn-primary px-4">
                            View 3D Model
                        </a>
                    </div>

                </div>

            </div>

        </div>
        {% empty %}
        <div class="col-12">
            <p>No topics available.</p>
        </div>
        {% endfor %}

    </div>

</div>

{% endblock content %}
